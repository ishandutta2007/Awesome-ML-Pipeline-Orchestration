<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #9ca3af;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #a7f3d0;
    }
    .node-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e5e7eb;
    }

    /* Dynamic SVG Keyframe Animations */
    @keyframes pulseLine {
      0% { stroke-dashoffset: 100; opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.3; }
    }

    @keyframes floatNode {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
      100% { transform: translateY(0px); }
    }

    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }

    .pulse-path {
      stroke-dasharray: 12 8;
      animation: pulseLine 4s linear infinite;
    }

    .floating-node-1 { animation: floatNode 5s ease-in-out infinite; }
    .floating-node-2 { animation: floatNode 6s ease-in-out infinite 1s; }
    .floating-node-3 { animation: floatNode 5.5s ease-in-out infinite 2s; }

    .background-glow {
      transform-origin: center;
      animation: pulseGlow 8s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Background Orbs -->
  <circle class="background-glow" cx="200" cy="100" r="180" fill="url(#glowGrad)" />
  <circle class="background-glow" cx="1000" cy="260" r="220" fill="url(#glowGrad)" />

  <!-- Animated Pipeline Flow Lines (In Background) -->
  <g opacity="0.35">
    <path class="pulse-path" d="M 100 80 Q 300 20 500 80 T 900 80 T 1100 120" fill="none" stroke="#8b5cf6" stroke-width="2.5" />
    <path class="pulse-path" d="M 50 280 Q 350 340 650 280 T 1150 260" fill="none" stroke="#6366f1" stroke-width="2" />
  </g>

  <!-- Visual Pipeline Nodes (Non-obstructing Background Elements) -->
  <g filter="url(#dropShadow)" opacity="0.45">
    <!-- Node 1: Ingestion -->
    <g class="floating-node-1" transform="translate(80, 240)">
      <rect width="110" height="42" rx="8" fill="url(#nodeGrad)" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="20" cy="21" r="5" fill="#10b981" />
      <text x="35" y="26" class="node-label">Data Ingest</text>
    </g>
    <!-- Node 2: Train -->
    <g class="floating-node-2" transform="translate(970, 70)">
      <rect width="120" height="42" rx="8" fill="url(#nodeGrad)" stroke="#8b5cf6" stroke-width="1.5" />
      <circle cx="20" cy="21" r="5" fill="#8b5cf6" />
      <text x="35" y="26" class="node-label">Model Train</text>
    </g>
    <!-- Node 3: Deploy -->
    <g class="floating-node-3" transform="translate(1010, 230)">
      <rect width="110" height="42" rx="8" fill="url(#nodeGrad)" stroke="#ec4899" stroke-width="1.5" />
      <circle cx="20" cy="21" r="5" fill="#ec4899" />
      <text x="35" y="26" class="node-label">Deploy/Serve</text>
    </g>
  </g>

  <!-- Foreground Content (Text & Main UI Elements - Crisp & Unobscured) -->
  <g filter="url(#dropShadow)">
    <!-- Top Pill Badge -->
    <g transform="translate(100, 65)">
      <rect width="250" height="30" rx="15" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <circle cx="18" cy="15" r="4" fill="#34d399" />
      <text x="30" y="20" class="badge-text">MLOps Ecosystem Guide 🚀</text>
    </g>

    <!-- Main Title -->
    <text x="100" y="145" class="title">Awesome ML Pipeline Orchestration</text>

    <!-- Subtitle -->
    <text x="100" y="185" class="subtitle">Curated SaaS Platforms, Open-Source Workflow Engines &amp; Kubernetes MLOps</text>

    <!-- Accent Gradient Line under Title -->
    <rect x="100" y="208" width="620" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Feature Tags Row -->
    <g transform="translate(100, 235)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="32" rx="6" fill="#1f2937" stroke="#374151" />
      <text x="14" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#60a5fa">⚡ MLOps DAGs</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="165" height="32" rx="6" fill="#1f2937" stroke="#374151" />
      <text x="156" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#c084fc">☸️ Kubernetes Native</text>

      <!-- Tag 3 -->
      <rect x="319" y="0" width="175" height="32" rx="6" fill="#1f2937" stroke="#374151" />
      <text x="333" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#f472b6">📊 Experiment Tracking</text>

      <!-- Tag 4 -->
      <rect x="506" y="0" width="150" height="32" rx="6" fill="#1f2937" stroke="#374151" />
      <text x="520" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#34d399">🔄 Reproducibility</text>
    </g>
  </g>
</svg>
